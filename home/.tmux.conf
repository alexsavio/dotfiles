# Prefix: Ctrl-Space (easy thumb reach)
unbind C-b
set -g prefix C-Space
bind Space send-prefix

# Zero delay on escape (no lag switching modes)
set -sg escape-time 0

# WASD-style pane navigation (prefix + h/j/k/l)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Quick pane resize (prefix + H/J/K/L, repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Shift+arrow to switch panes WITHOUT prefix (instant)
bind -n S-Left select-pane -L
bind -n S-Down select-pane -D
bind -n S-Up select-pane -U
bind -n S-Right select-pane -R

# Easy splits (prefix + v/s, like vim)
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"

# New window keeps current path
bind c new-window -c "#{pane_current_path}"

# Quick window switching (Ctrl+number, no prefix needed)
bind -n C-1 select-window -t 1
bind -n C-2 select-window -t 2
bind -n C-3 select-window -t 3
bind -n C-4 select-window -t 4
bind -n C-5 select-window -t 5

# Window numbering starts at 1 (no reaching for 0)
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Kill pane/window fast (no confirmation)
bind x kill-pane
bind X kill-window

# Reload config (prefix + r)
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# Mouse mode
set -g mouse on

# Bigger scrollback
set -g history-limit 50000

# True color support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Status bar - clean and minimal
set -g status-style "bg=#1a1a2e,fg=#e0e0e0"
set -g status-left "#[fg=#00ff88,bold] #S "
set -g status-right "#[fg=#888888]%H:%M "
set -g window-status-format "#[fg=#555555] #I:#W "
set -g window-status-current-format "#[fg=#00ff88,bold] #I:#W "

# Active pane border highlight
set -g pane-active-border-style "fg=#00ff88"
set -g pane-border-style "fg=#333333"
