"$schema" = 'https://starship.rs/config-schema.json'

# Tokyo Night preset (https://starship.rs/presets/tokyo-night), extended with
# username (SSH/root only), jobs, aws, c/cpp/python/elixir, battery, direnv and cmd_duration.
format = """
[░▒](fg:dir_bg)\
$username\
$jobs\
$directory\
[](fg:dir_bg bg:git_bg)\
$git_branch\
$git_status\
[](fg:git_bg bg:lang_bg)\
$c\
$cpp\
$rust\
$golang\
$nodejs\
$bun\
$php\
$python\
$elixir\
$aws\
[](fg:lang_bg bg:tail_bg)\
$battery\
$direnv\
$time\
[ ](fg:tail_bg)\
$cmd_duration\
$line_break\
$character"""

palette = 'tokyo_night'

[palettes.tokyo_night]
os_bg = '#a3aed2'
os_fg = '#090c0c'
dir_bg = '#769ff0'
dir_fg = '#e3e5e5'
git_bg = '#394260'
git_fg = '#769ff0'
lang_bg = '#212736'
lang_fg = '#769ff0'
tail_bg = '#1d2230'
tail_fg = '#a0a9cb'

[username]
# Hidden for the local login user; shown over SSH, as root, or as another user.
show_always = false
style_user = "bg:dir_bg fg:dir_fg"
style_root = "bg:os_bg fg:red bold"
format = '[ $user]($style)'

[jobs]
style = "bg:dir_bg fg:dir_fg"
format = "[ $symbol$number]($style)"
number_threshold = 1

[directory]
style = "fg:dir_fg bg:dir_bg"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = ""
style = "bg:git_bg"
format = '[[ $symbol $branch ](fg:git_fg bg:git_bg)]($style)'

[git_status]
style = "bg:git_bg"
format = '[[($all_status$ahead_behind )](fg:git_fg bg:git_bg)]($style)'
staged = "+${count}"
modified = "~${count}"
untracked = "?${count}"
deleted = "-${count}"
conflicted = "!${count}"
stashed = ""
ahead = "⇡${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
behind = "⇣${count}"

[git_commit]
commit_hash_length = 4
tag_symbol = "󰓹 "

[git_state]
format = '[\($state( $progress_current of $progress_total)\)]($style) '
cherry_pick = "[ PICKING](bold red)"

[c]
symbol = " "
style = "bg:lang_bg"
format = '[[ $symbol( $version) ](fg:lang_fg bg:lang_bg)]($style)'

[cpp]
symbol = " "
style = "bg:lang_bg"
format = '[[ $symbol( $version) ](fg:lang_fg bg:lang_bg)]($style)'

[rust]
symbol = ""
style = "bg:lang_bg"
format = '[[ $symbol( $version) ](fg:lang_fg bg:lang_bg)]($style)'

[golang]
symbol = ""
style = "bg:lang_bg"
format = '[[ $symbol( $version) ](fg:lang_fg bg:lang_bg)]($style)'

[nodejs]
symbol = ""
style = "bg:lang_bg"
format = '[[ $symbol( $version) ](fg:lang_fg bg:lang_bg)]($style)'

[bun]
symbol = ""
style = "bg:lang_bg"
format = '[[ $symbol( $version) ](fg:lang_fg bg:lang_bg)]($style)'

[php]
symbol = ""
style = "bg:lang_bg"
format = '[[ $symbol( $version) ](fg:lang_fg bg:lang_bg)]($style)'

[python]
symbol = ""
style = "bg:lang_bg"
format = '[[ $symbol( $version) ](fg:lang_fg bg:lang_bg)]($style)'

[elixir]
symbol = ""
style = "bg:lang_bg"
format = '[[ $symbol( $version) ](fg:lang_fg bg:lang_bg)]($style)'

[aws]
symbol = "󰸏 "
style = "bg:lang_bg"
format = '[[ $symbol( $profile( $region) )](fg:lang_fg bg:lang_bg)]($style)'

[aws.region_aliases]
us-east-1 = "nva"
us-east-2 = "ohio"
us-west-1 = "nca"
us-west-2 = "ore"
eu-west-1 = "dub"
eu-west-2 = "lon"
eu-west-3 = "par"
eu-central-1 = "frk"
eu-central-2 = "zur"
eu-north-1 = "sto"
eu-south-1 = "mil"
ap-northeast-1 = "tokyo"
ap-northeast-2 = "seoul"
ap-southeast-1 = "sgp"
ap-southeast-2 = "syd"
ap-south-1 = "mum"
ca-central-1 = "mtl"
sa-east-1 = "sao"

[battery]
full_symbol = "󰁹 "
charging_symbol = "󰂄 "
discharging_symbol = "󰂃 "
format = "[ $symbol$percentage ]($style)"

[[battery.display]]
threshold = 20
style = "bold fg:red bg:tail_bg"

[[battery.display]]
threshold = 50
style = "bold fg:yellow bg:tail_bg"

[direnv]
disabled = false
symbol = ""
style = "bg:tail_bg"
format = '[[ $symbol$loaded ](fg:tail_fg bg:tail_bg)]($style)'
loaded_msg = " direnv"
unloaded_msg = ""

[time]
disabled = false
time_format = "%R" # Hour:Minute Format
style = "bg:tail_bg"
format = '[[  $time ](fg:tail_fg bg:tail_bg)]($style)'

[cmd_duration]
min_time = 500
show_milliseconds = true
format = " in [$duration]($style) "
style = "bold yellow"
disabled = false

[line_break]
disabled = false

[character]
success_symbol = "[➜](bold green)"
error_symbol = "[✗](bold red) "

[package]
disabled = true

[docker_context]
disabled = true

[custom.compose]
disabled = true
